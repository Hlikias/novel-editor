# ============================================================
# 安卓 APK 打包（GitHub Actions ubuntu 云服务器 + Buildozer）
#
# 用法：
#   · 手动：仓库 Actions 页 → Build Android APK → Run workflow（出 Artifacts）
#   · 发布：git tag v1.0.1 && git push origin v1.0.1
#     → 自动打包并发布到 Releases（AI码小说-1.0.1-arm64-v8a.apk 等）
#
# 注意：首次打包要下载 Android SDK / python-for-android 工具链，
#   单次运行可能 20~40 分钟（GitHub 免费额度）。
# ============================================================
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装系统依赖（Buildozer / python-for-android 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: 安装 Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: 打包 APK
        run: |
          cd android_app
          # 默认只打 arm64-v8a（主流近两年手机），7GB runner 内存更稳；
          # 需要兼容老机（armeabi-v7a）时去掉 --arch 参数（时间会翻倍）
          python -m buildozer android debug --arch arm64-v8a
        env:
          ANDROIDSDK_HOME: /opt/android-sdk

      - name: 上传 APK（手动触发时从这里下载）
        uses: actions/upload-artifact@v4
        with:
          name: AI码小说-android
          path: android_app/bin/*.apk
          if-no-files-found: error

      - name: 发布到 GitHub Release（v* 标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android_app/bin/*.apk
          append_body: true
